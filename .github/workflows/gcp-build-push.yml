name: GCP Build & Push

# Builds the image, smoke-tests it, scans it with Trivy and - on main only -
# pushes it to Artifact Registry as <short sha>. Then run "GCP Deploy (Cloud Run)".
# Plain git/docker/gcloud commands only (all preinstalled on ubuntu-latest).
#
# Repo Settings -> Secrets and variables -> Actions:
#   secrets: GCP_WIF_PROVIDER, GCP_DEPLOY_SA
#   vars:    GCP_PROJECT_ID, GCP_REGION, GAR_REPOSITORY, IMAGE_NAME
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # keyless GCP login (Workload Identity Federation)

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init -q .
          git fetch -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          echo "IMAGE=stt:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: docker build -t "$IMAGE" .

      # Run it the way Cloud Run does (port 8080, read-only, no capabilities)
      # and transcribe the sample file.
      - name: Smoke test
        run: |
          docker run -d --name stt --read-only --cap-drop=ALL -p 8080:8080 -e S2T_PORT=8080 "$IMAGE"
          for i in $(seq 30); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf -F files=@tests/sample.wav localhost:8080/v1/transcribe | tee result.json
          jq -e '.results[0].text | length > 0' result.json

      - name: Security scan (fails on fixable CRITICAL vulnerabilities)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --no-progress --ignore-unfixed --severity CRITICAL,HIGH "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --quiet --ignore-unfixed --severity CRITICAL --exit-code 1 "$IMAGE"

      - name: Log in to GCP
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/${{ secrets.GCP_WIF_PROVIDER }}" \
            | jq -r .value > "$RUNNER_TEMP/oidc.jwt"
          gcloud iam workload-identity-pools create-cred-config "${{ secrets.GCP_WIF_PROVIDER }}" \
            --service-account="${{ secrets.GCP_DEPLOY_SA }}" \
            --credential-source-file="$RUNNER_TEMP/oidc.jwt" --output-file="$RUNNER_TEMP/gcp.json"
          gcloud auth login --cred-file="$RUNNER_TEMP/gcp.json" --quiet
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      # Tags are never overwritten, so a deploy of a tag is always reproducible.
      - name: Push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          REMOTE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.IMAGE_NAME }}:${GITHUB_SHA::7}"
          if gcloud artifacts docker images describe "$REMOTE" >/dev/null 2>&1; then
            echo "$REMOTE already exists - not overwriting"
          else
            docker tag "$IMAGE" "$REMOTE" && docker push "$REMOTE"
          fi
          echo "Pushed \`$REMOTE\` - deploy tag: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
