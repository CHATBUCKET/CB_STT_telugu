name: GCP Build, Push & Deploy

# Every push / pull request: build the image, smoke-test it, generate its SBOM
# (Syft) and scan the SBOM for vulnerabilities (Grype - fails on fixable
# CRITICAL findings).
# Push to develop only: push the image to Artifact Registry as
# develop-<short sha>, then deploy it to Cloud Run (job "deploy", environment
# "production" - add required reviewers there to gate it). Cloud Run moves
# traffic only once the new revision passes its startup probe; if the public
# health check then fails, traffic goes back to the previous revision.
#
# Actions: GitHub-owned or Marketplace "verified creator" only, pinned to a
# commit SHA (tags can be moved).
#
# Repo Settings -> Secrets and variables -> Actions:
#   secrets: GCP_WIF_PROVIDER, GCP_DEPLOY_SA
#   vars:    GCP_PROJECT_ID, GCP_REGION, GAR_REPOSITORY, IMAGE_NAME,
#            CLOUD_RUN_SERVICE, STT_HEALTH_URL, STT_ALLOWED_ORIGIN
on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write   # keyless GCP login (Workload Identity Federation)

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.IMAGE_NAME }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        id: tag
        run: |
          docker build -t stt .
          echo "tag=develop-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Run it the way Cloud Run does (port 8080, read-only, no capabilities)
      # and transcribe the sample file.
      - name: Smoke test
        run: |
          docker run -d --name stt --read-only --cap-drop=ALL -p 8080:8080 -e S2T_PORT=8080 stt
          for i in $(seq 30); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf -F files=@tests/sample.wav localhost:8080/v1/transcribe | tee result.json
          jq -e '.results[0].text | length > 0' result.json

      - name: SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: stt
          format: spdx-json
          output-file: sbom.spdx.json   # also kept as a run artifact

      - name: Vulnerability scan (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.spdx.json
          only-fixed: true
          severity-cutoff: critical
          output-format: table

      - name: Log in to GCP
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # Tags are immutable in the repository, so a re-run for the same commit
      # finds the image already there and skips the push.
      - name: Push
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          REMOTE="$IMAGE:${{ steps.tag.outputs.tag }}"
          if gcloud artifacts docker images describe "$REMOTE" >/dev/null 2>&1; then
            echo "$REMOTE already exists - not overwriting"
          else
            docker tag stt "$REMOTE" && docker push "$REMOTE"
          fi

  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-cloudrun   # one deploy at a time, never cancelled mid-rollout
    env:
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REGION: ${{ vars.GCP_REGION }}
      TAG: ${{ needs.build-push.outputs.tag }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # Only the image changes - scaling, env, probes, LB and Cloud Armor are
      # Terraform (gke-infra-terraform, modules/stt-cloudrun).
      - name: Deploy
        run: |
          PREV=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.latestReadyRevisionName)')
          echo "Current revision: $PREV"
          gcloud run services update "$SERVICE" --region "$REGION" --image "$IMAGE:$TAG" --quiet
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --quiet
          echo "Deployed \`$IMAGE:$TAG\` to \`$SERVICE\` (previous revision \`$PREV\`)" >> "$GITHUB_STEP_SUMMARY"

          [ -n "${{ vars.STT_HEALTH_URL }}" ] || exit 0   # no public URL configured yet
          for i in $(seq 12); do
            curl -sf -H "Origin: ${{ vars.STT_ALLOWED_ORIGIN }}" "${{ vars.STT_HEALTH_URL }}" && exit 0
            sleep 5
          done
          echo "::error::health check failed - rolling back to $PREV"
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-revisions "$PREV=100" --quiet
          exit 1
